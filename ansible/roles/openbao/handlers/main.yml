---
# Restarting a vault is not the routine act it is for the other stacks here,
# which is why this is a handler rather than an unconditional step: it runs
# only when openbao.hcl actually changed.
#
# What it costs while it happens: every certificate login on the platform,
# since `make ssh` asks this vault to sign. What it does not cost is the seal —
# the instance unseals itself from its key on local disk, so nothing has to be
# typed and no human has to be present. The role waits for that below.
- name: Restart openbao
  no_log: true
  community.docker.docker_compose_v2:
    project_src: "{{ openbao_deploy_dir }}"
    state: restarted

# First boot must reach initialization in the role. An existing vault must
# finish auto-unsealing before downstream consumers can use it.
- name: Wait for the vault to become ready after a restart
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openbao_port }}/v1/sys/seal-status"
    method: GET
    status_code: 200
    return_content: true
  register: openbao_restart_status
  until: >-
    openbao_restart_status.json is defined and
    ((not (openbao_restart_status.json.initialized | bool)) or
    (not (openbao_restart_status.json.sealed | bool)))
  retries: "{{ openbao_ready_retries }}"
  delay: "{{ openbao_ready_delay }}"
  changed_when: false
  listen: Restart openbao
