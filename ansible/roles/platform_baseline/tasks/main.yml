---
- name: Require supported Debian hosts
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'Debian'
      - platform_access_mode in ['bootstrap', 'operational']
    fail_msg: This baseline supports Debian and Proxmox Debian hosts only.

- name: Install the minimal host baseline
  ansible.builtin.apt:
    name: [ca-certificates, curl, openssh-server, python3, chrony]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read the current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: platform_current_timezone
  changed_when: false

- name: Set the requested timezone
  ansible.builtin.command:
    argv: [timedatectl, set-timezone, "{{ platform_timezone }}"]
  when: platform_current_timezone.stdout != platform_timezone
  changed_when: true

- name: Ensure the clock is synchronized
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

- name: Secure guest ingress before joining Tailscale
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_cutover: false
  when: inventory_hostname in groups.get('platform_vms', [])

- name: Join and verify the private network
  ansible.builtin.import_tasks: tailscale.yml
  when: platform_tailscale_required
