---
- name: Require an immutable Hermes template and isolated runtime identity
  ansible.builtin.assert:
    that:
      - native_instance.software.runtime == 'systemd'
      - native_instance.software.commit is match('^[a-f0-9]{40}$')
      - native_instance.software.installer_sha256 is match('^[a-f0-9]{64}$')
      - native_deployment_file | length > 0

- name: Install native runtime prerequisites
  ansible.builtin.apt:
    name: [git, curl, tar, ca-certificates, build-essential, libatomic1, python3]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create private persistent application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: hermes
    group: hermes
    mode: '0700'
  loop: [/var/lib/hermes/.hermes]

- name: Install the verified upstream source installer
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/NousResearch/hermes-agent/{{ native_instance.software.commit }}/scripts/install.sh"
    checksum: "sha256:{{ native_instance.software.installer_sha256 }}"
    dest: /var/lib/hermes/.milkyway/install.sh
    owner: hermes
    group: hermes
    mode: '0700'

- name: Inspect the accepted runtime installation receipt
  ansible.builtin.stat:
    path: "/var/lib/hermes/.milkyway/installed-{{ native_instance.software.commit }}-{{ native_instance.parameters.browser | bool | ternary('browser', 'minimal') }}"
  register: hermes_installation

- name: Inspect an existing Hermes source checkout
  become_user: hermes
  ansible.builtin.command:
    argv: [git, -C, /var/lib/hermes/.hermes/hermes-agent, rev-parse, HEAD]
  register: hermes_existing_commit
  changed_when: false
  failed_when: false

- name: Reject an unexpected existing Hermes source version
  ansible.builtin.assert:
    that: hermes_existing_commit.stdout == native_instance.software.commit
  when: hermes_existing_commit.rc == 0

- name: Install the pinned Hermes runtime without interactive configuration
  become_user: hermes
  ansible.builtin.command:
    argv: "{{ ['bash', '/var/lib/hermes/.milkyway/install.sh', '--commit', native_instance.software.commit, '--non-interactive', '--skip-computer-use'] + (native_instance.parameters.browser | bool | ternary([], ['--skip-browser'])) }}"
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
  when:
    - not hermes_installation.stat.exists
    - hermes_existing_commit.rc != 0
  no_log: true
  notify: Restart native hermes

- name: Install Chromium system dependencies when requested
  ansible.builtin.apt:
    name: [libnss3, libatk1.0-0t64, libatk-bridge2.0-0t64, libcups2t64, libdrm2, libxkbcommon0, libxcomposite1, libxdamage1, libxfixes3, libxrandr2, libgbm1, libasound2t64, libpango-1.0-0, libcairo2]
    state: present
  when: native_instance.parameters.browser | bool

- name: Install the minimal private Bot Desktop stack
  ansible.builtin.apt:
    name:
      - tigervnc-standalone-server
      - xfce4-panel
      - xfwm4
      - xfdesktop4
      - xfce4-settings
      - xfce4-terminal
      - dbus-x11
      - x11-xserver-utils
      - x11-utils
      - x11-xkb-utils
      - xauth
      - fonts-dejavu-core
    state: present
    install_recommends: false
  when: native_instance.parameters.bot_desktop | bool

- name: Verify the installed source commit
  become_user: hermes
  ansible.builtin.command:
    argv: [git, -C, /var/lib/hermes/.hermes/hermes-agent, rev-parse, HEAD]
  register: hermes_installed_commit
  changed_when: false

- name: Enable the requested browser through the managed package installer
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, pm, install, agent-browser]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  when: native_instance.parameters.browser | bool and not hermes_installation.stat.exists
  no_log: true

- name: Reject runtime version drift
  ansible.builtin.assert:
    that: hermes_installed_commit.stdout == native_instance.software.commit

- name: Check the pinned computer-use driver
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, computer-use, status]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  register: hermes_computer_use_status
  changed_when: false
  failed_when: false
  when: native_instance.parameters.bot_desktop | bool
  no_log: true

- name: Install the pinned computer-use driver
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, computer-use, install]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  when:
    - native_instance.parameters.bot_desktop | bool
    - hermes_computer_use_status.rc != 0 or 'Runtime contract ready' not in hermes_computer_use_status.stdout
  no_log: true

- name: Verify the pinned computer-use driver after reconciliation
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, computer-use, status]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  register: hermes_computer_use_ready
  changed_when: false
  failed_when: hermes_computer_use_ready.rc != 0 or 'Runtime contract ready' not in hermes_computer_use_ready.stdout
  when: native_instance.parameters.bot_desktop | bool
  no_log: true

- name: Record the completed installation
  ansible.builtin.copy:
    dest: "/var/lib/hermes/.milkyway/installed-{{ native_instance.software.commit }}-{{ native_instance.parameters.browser | bool | ternary('browser', 'minimal') }}"
    content: "{{ native_instance.software.release }}\n"
    owner: hermes
    group: hermes
    mode: '0600'

- name: Inspect the existing native configuration
  ansible.builtin.stat:
    path: /var/lib/hermes/.hermes/config.yaml
  register: hermes_config_file

- name: Preserve settings outside the managed configuration
  ansible.builtin.slurp:
    src: /var/lib/hermes/.hermes/config.yaml
  register: hermes_existing_config
  when: hermes_config_file.stat.exists
  no_log: true

- name: Configure the native agent
  ansible.builtin.copy:
    content: "{{ ((hermes_existing_config.content | default('e30=') | b64decode | from_yaml) or {}) | combine({'model': {'provider': native_instance.parameters.provider, 'default': native_instance.parameters.model}, 'terminal': {'backend': 'local'}, 'agent': {'disabled_toolsets': native_instance.parameters.browser | bool | ternary([], ['browser'])}} | combine({'browser': {'headed': true}, 'bot_desktop': {'auto_start': true}} if native_instance.parameters.bot_desktop else {}) | combine({'dashboard': {'public_url': native_instance.env.HERMES_DASHBOARD_PUBLIC_URL, 'trusted_proxies': [native_dashboard_proxy_address], 'oauth': {'provider': 'self-hosted', 'self_hosted': {'issuer': native_instance.env.HERMES_DASHBOARD_OIDC_ISSUER, 'client_id': native_dashboard_client_id, 'scopes': (native_instance.env.HERMES_DASHBOARD_OIDC_SCOPES | default('openid profile email')).split()}}}} if native_instance.parameters.dashboard | default(false) else {}) | combine({'webapp': {'enabled': native_instance.parameters.webapp | default(false), 'host': '0.0.0.0', 'port': 9120, 'public_url': native_instance.env.HERMES_WEBAPP_PUBLIC_URL}} if native_instance.parameters.webapp | default(false) else {'webapp': {'enabled': false}}), recursive=true) | to_nice_yaml }}"
    dest: /var/lib/hermes/.hermes/config.yaml
    owner: hermes
    group: hermes
    mode: '0600'
    backup: true
  no_log: true
  notify: [Restart native hermes, Restart native dashboard]

- name: Build the browser workspace without launching another gateway
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, webapp, --build-only]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  register: hermes_webapp_build
  changed_when: "'renderer built:' in hermes_webapp_build.stdout"
  when: native_instance.parameters.webapp | default(false) | bool
  no_log: true

- name: Resolve the workload runtime UID
  ansible.builtin.getent:
    database: passwd
    key: hermes

- name: Inspect the competing user gateway unit
  ansible.builtin.stat:
    path: /var/lib/hermes/.config/systemd/user/hermes-gateway.service
  register: hermes_user_gateway_unit

- name: Inspect a competing user gateway service
  become_user: hermes
  ansible.builtin.command:
    argv: [systemctl, --user, is-active, hermes-gateway.service]
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.hermes[1] }}"
  register: hermes_user_gateway
  changed_when: false
  failed_when: hermes_user_gateway.rc not in [0, 3, 4]
  when: hermes_user_gateway_unit.stat.exists

- name: Stop the competing system gateway retry loop before migration
  ansible.builtin.systemd_service:
    name: hermes-agent
    state: stopped
  when: hermes_user_gateway.rc | default(3) == 0

- name: Stop the user gateway only when upstream permits stopping live sessions
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, gateway, stop]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.hermes[1] }}"
  when: hermes_user_gateway.rc | default(3) == 0
  no_log: true

- name: Disable duplicate user gateway supervision
  become_user: hermes
  ansible.builtin.systemd_service:
    name: hermes-gateway
    scope: user
    enabled: false
    state: stopped
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ getent_passwd.hermes[1] }}"
  when: hermes_user_gateway_unit.stat.exists

- name: Verify required credentials before enabling the agent
  become_user: hermes
  ansible.builtin.command:
    argv: [python3, /usr/local/lib/milkyway/secret_env.py, --bindings, /var/lib/hermes/.milkyway/bindings.json, --credentials, /var/lib/hermes/.milkyway/identity.json, --check]
  changed_when: false
  no_log: true

- name: Install the native service
  ansible.builtin.template:
    src: hermes-agent.service.j2
    dest: /etc/systemd/system/hermes-agent.service
    owner: root
    group: root
    mode: '0644'
  register: hermes_service_definition
  changed_when: >-
    hermes_service_definition.changed or native_runtime_clients.changed or
    native_runtime_identity.changed or native_runtime_bindings.changed
  notify: Restart native hermes

- name: Install an administrator launcher for interactive use
  ansible.builtin.copy:
    dest: /usr/local/bin/hermes-agent
    owner: root
    group: root
    mode: '0755'
    content: |
      #!/bin/sh
      set -eu
      exec runuser -u hermes -- env HOME=/var/lib/hermes HERMES_HOME=/var/lib/hermes/.hermes PATH=/var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin /usr/bin/python3 /usr/local/lib/milkyway/secret_env.py --bindings /var/lib/hermes/.milkyway/bindings.json --credentials /var/lib/hermes/.milkyway/identity.json -- /var/lib/hermes/.local/bin/hermes "$@"

- name: Enable Hermes at boot
  ansible.builtin.systemd_service:
    name: hermes-agent
    enabled: true
    state: started
    daemon_reload: true

- name: Inspect the private Bot Desktop screen
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, computer-use, screen, status]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  register: hermes_bot_screen_status
  changed_when: false
  failed_when: >-
    hermes_bot_screen_status.rc != 0 and not
    (hermes_bot_screen_status.rc == 1 and
    'not running' in hermes_bot_screen_status.stdout)
  when: native_instance.parameters.bot_desktop | bool

- name: Start the private Bot Desktop screen
  become_user: hermes
  ansible.builtin.command:
    argv: [/var/lib/hermes/.local/bin/hermes, computer-use, screen, start]
  environment:
    HOME: /var/lib/hermes
    HERMES_HOME: /var/lib/hermes/.hermes
    PATH: /var/lib/hermes/.local/bin:/usr/local/bin:/usr/bin:/bin
  when:
    - native_instance.parameters.bot_desktop | bool
    - "'not running' in hermes_bot_screen_status.stdout"

- name: Confirm the private Bot Desktop socket exists
  ansible.builtin.stat:
    path: /var/lib/hermes/.hermes/bot-desktop/rfb.sock
  register: hermes_bot_screen_socket
  when: native_instance.parameters.bot_desktop | bool

- name: Reject a missing or non-socket Bot Desktop display
  ansible.builtin.assert:
    that:
      - hermes_bot_screen_socket.stat.exists
      - hermes_bot_screen_socket.stat.issock
  when: native_instance.parameters.bot_desktop | bool

- name: Require a private listener and a public PKCE client for the dashboard
  ansible.builtin.assert:
    that:
      - platform_tailnet_address is match('^100\.')
      - native_dashboard_proxy_address is match('^100\.')
      - native_dashboard_client_id is match('^[a-f0-9]{32}$')
      - native_instance.env.HERMES_DASHBOARD_PUBLIC_URL is match('^https://')
      - native_instance.env.HERMES_DASHBOARD_OIDC_ISSUER is match('^https://')
  when: native_instance.parameters.dashboard | default(false)

- name: Install the authenticated native dashboard service
  ansible.builtin.template:
    src: hermes-dashboard.service.j2
    dest: /etc/systemd/system/hermes-dashboard.service
    owner: root
    group: root
    mode: '0644'
  register: hermes_dashboard_definition
  changed_when: >-
    hermes_dashboard_definition.changed or native_runtime_clients.changed or
    native_runtime_identity.changed or native_runtime_bindings.changed
  when: native_instance.parameters.dashboard | default(false)
  notify: Restart native dashboard

- name: Enable the native dashboard at boot
  ansible.builtin.systemd_service:
    name: hermes-dashboard
    enabled: true
    state: started
    daemon_reload: true
  when: native_instance.parameters.dashboard | default(false)

- name: Inspect an existing dashboard service before disabling it
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes-dashboard.service
  register: hermes_dashboard_unit
  when: not (native_instance.parameters.dashboard | default(false))

- name: Stop dashboard access when the recipe disables it
  ansible.builtin.systemd_service:
    name: hermes-dashboard
    enabled: false
    state: stopped
  when:
    - not (native_instance.parameters.dashboard | default(false))
    - hermes_dashboard_unit.stat.exists

- name: Apply dashboard changes
  ansible.builtin.meta: flush_handlers
