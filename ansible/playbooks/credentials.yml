---
- name: Establish external operational credential ownership
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Seed external credentials during bootstrap only
      ansible.builtin.include_role:
        name: platform_credentials
        tasks_from: seed
      vars:
        platform_bao_token_file: "{{ platform_bootstrap_bao_token_file }}"
      when: platform_access_mode == 'bootstrap'

    - name: Validate operational credentials without bootstrap fallback
      ansible.builtin.include_role:
        name: platform_credentials
      vars:
        platform_credential_bao_path: "{{ item.path }}"
        platform_credential_field: "{{ item.field }}"
      loop:
        - {path: platform/tailscale/auth_key, field: key}
        - {path: platform/hostinger/api, field: token}
      when: platform_access_mode == 'operational'

    - name: Forget resolved credential values
      ansible.builtin.set_fact:
        platform_resolved_credential: ""
        platform_credential_response: {}
        platform_seed_current: {}
      no_log: true
