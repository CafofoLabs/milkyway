[project]
name = "MilkyWay"
repository = "CafofoLabs/milkyway"
documentation = "public"

[git]
author_name = "Thiago Dias"
author_email = "thiago@thir.info"

[checks]
commands = [
  ["uv", "run", "--frozen", "--project", "app-templates/fastmcp-proxy", "pytest", "app-templates/fastmcp-proxy/tests"],
  [
    "uv",
    "run",
    "--frozen",
    "--project",
    ".nebula",
    "ruff",
    "check",
    "scripts",
    "tests",
    "app-templates"
  ],
  [
    "uv",
    "run",
    "--frozen",
    "--project",
    ".nebula",
    "ruff",
    "format",
    "--check",
    "scripts",
    "tests",
    "app-templates"
  ],
  [
    "uv",
    "run",
    "--frozen",
    "--project",
    ".nebula",
    "pytest",
    "tests"
  ],
  [
    "make",
    "infrastructure-check"
  ]
]
